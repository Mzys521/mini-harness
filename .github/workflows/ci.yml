# 文件：.github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # chromadb>=1.0 与 mcp>=2 要求 3.12+；3.11 仍可用于库本身与 [server] 路径。
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[server,dev]"

      - name: Compile
        run: python -m compileall -q harness tests

      - name: Test
        run: pytest -q

      - name: Build package
        if: matrix.python-version == '3.13'
        run: python -m build
