# 文件：.github/workflows/ci.yml
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 保留轻量 Core 路径，同时在 3.12 安装全部可选依赖并运行真实集成测试。
        include:
          - python-version: "3.12"
            extras: "server,dev"
          - python-version: "3.13"
            extras: "server,dev"
          - python-version: "3.12"
            extras: "all,dev"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install -e ".[${{ matrix.extras }}]"

      - name: Verify optional integrations are installed
        if: matrix.extras == 'all,dev'
        run: python -c "import chromadb, mcp"

      - name: Compile
        run: python -m compileall -q harness tests

      - name: Test
        run: pytest -q

      - name: Build package
        if: matrix.python-version == '3.13'
        run: python -m build
