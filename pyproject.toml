# 文件：pyproject.toml
[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-harness"
version = "0.13.0"
description = "A lightweight, production-grade Agent Harness with explicit runtime, tools, security and durable execution."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "mini-harness contributors"},
]
keywords = ["ai", "agent", "harness", "llm", "rag", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.0",
    "opentelemetry-api>=1.0",
]

[project.optional-dependencies]
rag = [
    "chromadb>=1.0",
]
mcp = [
    "mcp[cli]>=2,<3",
]
observability = [
    "opentelemetry-sdk>=1.0",
    "opentelemetry-exporter-otlp-proto-http>=1.0",
]
server = [
    "fastapi>=0.141.1,<1",
    "uvicorn[standard]>=0.52.0,<1",
]
all = [
    "mini-harness[rag,mcp,observability,server]",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
    "mypy>=1.15",
    "httpx>=0.28,<1",
    "build>=1.2",
]

[project.scripts]
mini-harness = "harness.cli:main"

[project.urls]
Homepage = "https://github.com/Mzys521/mini-harness"
Repository = "https://github.com/Mzys521/mini-harness"
Issues = "https://github.com/Mzys521/mini-harness/issues"

[tool.setuptools.packages.find]
include = ["harness*"]
exclude = ["tests*", "examples*", "app_tools*", "mcp_servers*"]

[tool.setuptools.package-data]
# 工作台构建产物（Vue 3 + Vite）入库在 harness/ui/static；Vite 输出的哈希资源
# 位于 static/assets/，因此必须显式列出，否则安装后只剩一个没有 JS/CSS 的空壳页面。
"harness.ui" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.svg",
    "static/assets/*.js",
    "static/assets/*.css",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 让 tests 能 import 仓库根下的 app_tools / tests（两者都被 packages.find 排除在
# 发行版之外）。必须显式声明：`python -m pytest` 会把 cwd 加进 sys.path，但 CI 与
# 装了 console_scripts 的环境跑的是 `pytest`，不会——只靠 cwd 会让同一套用例在
# 本地全绿、在 CI 全部 collection error。
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
