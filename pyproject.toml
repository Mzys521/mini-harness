# 文件：pyproject.toml
[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-harness"
version = "0.11.0"
description = "A lightweight, production-oriented Agent Harness learning project."
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "jsonschema>=4.0",
    "chromadb>=1.0",
    "mcp[cli]>=2,<3",
    "opentelemetry-api>=1.0",
    "opentelemetry-sdk>=1.0",
    "opentelemetry-exporter-otlp-proto-http>=1.0",
    "fastapi>=0.141.1,<1",
    "uvicorn[standard]>=0.52.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.12",
    "mypy>=1.15",
    "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
# Discovered from the module names: the repository root also holds workspace
# directories (frontend/, scripts/, tests/, evals/, data/, ...), so automatic
# flat-layout discovery refuses to build a wheel.
include = ["harness*", "app_tools*", "mcp_servers*"]

[tool.setuptools.package-data]
# The built workspace is committed under harness/ui/static. Vite emits hashed
# bundles into static/assets/, so those patterns are required — without them an
# installed wheel would ship index.html with no JS or CSS.
"harness.ui" = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.svg",
    "static/assets/*.js",
    "static/assets/*.css",
]

[tool.setuptools]
# `main.py` is the documented entry point; ship it as a top-level module.
py-modules = ["main"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
